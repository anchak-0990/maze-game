        * {

            text-shadow: 0 0 10px #00ff41;
        }

        .subtitle {
            margin: 5px 0 25px;
            color: #00aa2a;
        }

        button {
            font-family: "Courier New", monospace;
            cursor: pointer;
            color: #00ff41;
            background: #000;
            border: 1px solid #00ff41;
            padding: 12px 22px;
            font-size: 16px;
            margin: 6px;
            transition: 0.2s;
            touch-action: manipulation;
            user-select: none;
        }

        button:hover {
            background: #003311;
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.5);
        }

        button:active {
            background: #00551c;
        }

        .menu-button {
            display: block;
            width: 280px;
            max-width: 100%;
            margin: 15px auto;

        #menu p {

        }

        #gameScreen {
            display: none;

        #hud {
            display: flex;

            gap: 12px;
            margin-bottom: 15px;

        .hud-item {
            border: 1px solid #00ff41;
            padding: 7px 12px;
            min-width: 105px;
            font-size: 14px;
        }

        #mazeWrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }

        #maze {
            display: grid;
            gap: 1px;
            background: #00ff41;
            border: 3px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.25);
            width: min(80vw, 650px);
            height: min(80vw, 650px);
            max-width: 80vh;
            max-height: 80vh;
            user-select: none;
        }

        .cell {
            background: #050505;
            min-width: 0;
            min-height: 0;
        }

        .wall {
            background: #222;
            box-shadow: inset 0 0 4px #000;
        }

        .player {
            background: #00ff41;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff41;
            margin: 15%;
        }

        .exit {
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff0000;
            margin: 15%;
        }

        #message {
            min-height: 24px;
            margin: 15px 0 5px;
        }

        #controls {
            margin-top: 10px;
        }

        .control-row {
            display: flex;
            justify-content: center;
        }

        .control-button {
            width: 58px;
            height: 48px;
            padding: 0;
            margin: 3px;
            font-size: 22px;
        }

        #winScreen {

        }

        #winScreen h2 {
            font-size: 30px;
            text-shadow: 0 0 10px #00ff41;
        }

        .win-stats {
            border: 1px solid #00ff41;
            padding: 15px;
            margin: 20px auto;
            max-width: 350px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            #game {
                padding: 12px;
            }

            #maze {
                width: 88vw;
                height: 88vw;
            }

            .hud-item {
                min-width: 90px;
                font-size: 12px;
            }
        }
    </style>
</head>

<script>

    /* =========================
       НАЛАШТУВАННЯ
    ========================== */

    const MIN_SIZE = 9;
    const MAX_SIZE = 25;

    let currentLevel = 1;
    let currentMode = "campaign";

    let maze = [];
    let mazeSize = MIN_SIZE;

    let player = {
        x: 0,
        y: 0
    };

    let exit = {
        x: 0,
        y: 0
    };

    let moves = 0;
    let seconds = 0;

    let timer = null;

    let gamePaused = false;
    let gameActive = false;

    let currentSeed = 0;


    /* =========================
       HTML ЕЛЕМЕНТИ
    ========================== */

    const menu =
        document.getElementById("menu");

    const gameScreen =
        document.getElementById("gameScreen");

    const winScreen =
        document.getElementById("winScreen");

    const mazeContainer =
        document.getElementById("maze");

    const modeText =
        document.getElementById("modeText");

    const levelText =
        document.getElementById("levelText");

    const sizeText =
        document.getElementById("sizeText");

    const movesText =
        document.getElementById("movesText");

    const timeText =
        document.getElementById("timeText");

    const message =
        document.getElementById("message");

    const pauseButton =
        document.getElementById("pauseButton");


    /* =========================
       КНОПКИ
    ========================== */

    document
        .getElementById("campaignButton")
        .addEventListener(
            "click",
            startCampaign
        );

    document
        .getElementById("randomButton")
        .addEventListener(
            "click",
            startRandom
        );

    document
        .getElementById("restartButton")
        .addEventListener(
            "click",
            restartLevel
        );

    pauseButton.addEventListener(
        "click",
        pauseGame
    );

    document
        .getElementById("menuButton")
        .addEventListener(
            "click",
            backToMenu
        );

    document
        .getElementById("nextLevelButton")
        .addEventListener(
            "click",
            nextLevel
        );

    document
        .getElementById("winMenuButton")
        .addEventListener(
            "click",
            backToMenu
        );


    /* =========================
       СЕНСОРНІ КНОПКИ
    ========================== */

    document
        .getElementById("upButton")
        .addEventListener(
            "click",
            function () {
                movePlayer(0, -1);
            }
        );

    document
        .getElementById("downButton")
        .addEventListener(
            "click",
            function () {
                movePlayer(0, 1);
            }
        );

    document
        .getElementById("leftButton")
        .addEventListener(
            "click",
            function () {
                movePlayer(-1, 0);
            }
        );

    document
        .getElementById("rightButton")
        .addEventListener(
            "click",
            function () {
                movePlayer(1, 0);
            }
        );


    /* =========================
       РОЗМІР
    ========================== */

    function getMazeSize(level) {

        if (level <= 3) {
            return 9;
        }

        if (level <= 6) {
            return 11;
        }

        if (level <= 10) {
            return 13;
        }

        if (level <= 15) {
            return 15;
        }

        if (level <= 20) {
            return 17;
        }

        if (level <= 25) {
            return 19;
        }

        if (level <= 30) {
            return 21;
        }

        if (level <= 35) {
            return 23;
        }

        return MAX_SIZE;
    }


    /* =========================
       ПСЕВДОВИПАДКОВІ ЧИСЛА
    ========================== */

    function createSeedRandom(seed) {

        let value =
            seed >>> 0;

        return function () {

            value += 0x6D2B79F5;

            let t = value;

            t =
                Math.imul(
                    t ^ (t >>> 15),
                    t | 1
                );

            t ^=
                t +
                Math.imul(
                    t ^ (t >>> 7),
                    t | 61
                );

            return (
                (t ^ (t >>> 14)) >>> 0
            ) / 4294967296;
        };
    }


    /* =========================
       SHUFFLE
    ========================== */

    function shuffleDirections(
        directions,
        random
    ) {

        for (
            let i = directions.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    random() * (i + 1)
                );

            const temp =
                directions[i];

            directions[i] =
                directions[j];

            directions[j] =
                temp;
        }

        return directions;
    }


    /* =========================
       БАЗОВИЙ ГЕНЕРАТОР
    ========================== */

    function generateBaseMaze(
        size,
        seed
    ) {

        const grid = [];

        for (
            let y = 0;
            y < size;
            y++
        ) {

            grid[y] = [];

            for (
                let x = 0;
                x < size;
                x++
            ) {

                grid[y][x] = 1;
            }
        }


        const random =
            createSeedRandom(seed);

        const stack = [];

        grid[0][0] = 0;

        stack.push({
            x: 0,
            y: 0
        });


        while (
            stack.length > 0
        ) {

            const current =
                stack[
                    stack.length - 1
                ];


            let directions = [

                {
                    dx: 2,
                    dy: 0
                },

                {
                    dx: -2,
                    dy: 0
                },

                {
                    dx: 0,
                    dy: 2
                },

                {
                    dx: 0,
                    dy: -2
                }

            ];


            directions =
                shuffleDirections(
                    directions,
                    random
                );


            let moved = false;


            for (
                let i = 0;
                i < directions.length;
                i++
            ) {

                const direction =
                    directions[i];


                const nx =
                    current.x +
                    direction.dx;

                const ny =
                    current.y +
                    direction.dy;


                if (nx < 0) {
                    continue;
                }

                if (nx >= size) {
                    continue;
                }

                if (ny < 0) {
                    continue;
                }

                if (ny >= size) {
                    continue;
                }

                if (grid[ny][nx] !== 1) {
                    continue;
                }


                const middleX =
                    current.x +
                    direction.dx / 2;

                const middleY =
                    current.y +
                    direction.dy / 2;


                grid[middleY][middleX] =
                    0;

                grid[ny][nx] =
                    0;


                stack.push({
                    x: nx,
                    y: ny
                });


                moved = true;

                break;
            }


            if (!moved) {
                stack.pop();
            }
        }


        return grid;
    }


    /* =========================
       ПІДСИЛЕННЯ СКЛАДНОСТІ
    ========================== */

    function getDifficulty(level) {

        if (level <= 3) {
            return {
                attempts: 3,
                extraOpenings: 0,
                targetMultiplier: 0.65
            };
        }

        if (level <= 6) {
            return {
                attempts: 5,
                extraOpenings: 1,
                targetMultiplier: 0.85
            };
        }

        if (level <= 10) {
            return {
                attempts: 7,
                extraOpenings: 2,
                targetMultiplier: 1.00
            };
        }

        if (level <= 15) {
            return {
                attempts: 8,
                extraOpenings: 3,
                targetMultiplier: 1.15
            };
        }

        if (level <= 20) {
            return {
                attempts: 9,
                extraOpenings: 4,
                targetMultiplier: 1.30
            };
        }

        if (level <= 25) {
            return {
                attempts: 10,
                extraOpenings: 5,
                targetMultiplier: 1.45
            };
        }

        if (level <= 30) {
            return {
                attempts: 10,
                extraOpenings: 6,
                targetMultiplier: 1.60
            };
        }

        if (level <= 35) {
            return {
                attempts: 11,
                extraOpenings: 7,
                targetMultiplier: 1.75
            };
        }

        return {
            attempts: 12,
            extraOpenings: 8,
            targetMultiplier: 1.90
        };
    }


    /* =========================
       ВИЗНАЧЕННЯ ДОВЖИНИ ШЛЯХУ
    ========================== */

    function findPathLength(
        grid,
        size
    ) {

        const distance = [];

        for (
            let y = 0;
            y < size;
            y++
        ) {

            distance[y] =
                new Array(size).fill(-1);
        }


        const queue = [];

        queue.push({
            x: 0,
            y: 0
        });

        distance[0][0] = 0;


        let index = 0;


        while (
            index < queue.length
        ) {

            const current =
                queue[index++];

            const directions = [

                {
                    dx: 1,
                    dy: 0
                },

                {
                    dx: -1,
                    dy: 0
                },

                {
                    dx: 0,
                    dy: 1
                },

                {
                    dx: 0,
                    dy: -1
                }

            ];


            for (
                let i = 0;
                i < directions.length;
                i++
            ) {

                const nx =
                    current.x +
                    directions[i].dx;

                const ny =
                    current.y +
                    directions[i].dy;


                if (nx < 0) {
                    continue;
                }

                if (nx >= size) {
                    continue;
                }

                if (ny < 0) {
                    continue;
                }

                if (ny >= size) {
                    continue;
                }

                if (
                    grid[ny][nx] === 1
                ) {
                    continue;
                }

                if (
                    distance[ny][nx] !== -1
                ) {
                    continue;
                }


                distance[ny][nx] =
                    distance[current.y][current.x] + 1;


                queue.push({
                    x: nx,
                    y: ny
                });
            }
        }


        return distance[size - 1][size - 1];
    }


    /* =========================
       КІЛЬКІСТЬ ТУПИКІВ
    ========================== */

    function countDeadEnds(
        grid,
        size
    ) {

        let count = 0;


        for (
            let y = 1;
            y < size - 1;
            y++
        ) {

            for (
                let x = 1;
                x < size - 1;
                x++
            ) {

                if (
                    grid[y][x] === 1
                ) {
                    continue;
                }


                let exits = 0;


                if (
                    grid[y - 1][x] === 0
                ) {
                    exits++;
                }

                if (
                    grid[y + 1][x] === 0
                ) {
                    exits++;
                }

                if (
                    grid[y][x - 1] === 0
                ) {
                    exits++;
                }

                if (
                    grid[y][x + 1] === 0
                ) {
                    exits++;
                }


                if (
                    exits === 1
                ) {
                    count++;
                }
            }
        }


        return count;
    }
    
    function addDifficultyFeatures(grid, size, level, random) {
        const difficulty = getDifficulty(level);

        /*
         * Додаємо додаткові проходи не хаотично.
         * Намагаємося створювати бічні маршрути та петлі,
         * але не руйнувати основний шлях до виходу.
         */
        let added = 0;
        let safety = 0;

        while (added < difficulty.extraOpenings && safety < 500) {
            safety++;

            const x = 1 + Math.floor(random() * (size - 2));
            const y = 1 + Math.floor(random() * (size - 2));

            if (grid[y][x] !== 0) continue;

            const neighbors = [];

            if (x > 0) neighbors.push({ x: x - 1, y });
            if (x < size - 1) neighbors.push({ x: x + 1, y });
            if (y > 0) neighbors.push({ x, y: y - 1 });
            if (y < size - 1) neighbors.push({ x, y: y + 1 });

            const openNeighbors = neighbors.filter(
                cell => grid[cell.y][cell.x] === 0
            );

            if (openNeighbors.length === 1) {
                grid[y][x] = 0;
                added++;
            }
        }
    }


    function scoreMaze(grid, size, level) {
        const difficulty = getDifficulty(level);

        const pathLength = findPathLength(grid, size);
        const deadEnds = countDeadEnds(grid, size);

        if (pathLength <= 0) return -Infinity;

        const straightLine = (size - 1) * 2;

        const targetPath =
            straightLine * difficulty.targetMultiplier +
            (size * size * 0.35);

        const pathDifference = Math.abs(pathLength - targetPath);

        /*
         * Чим довший правильний маршрут і чим більше
         * тупиків — тим складнішим вважаємо лабіринт.
         */
        const pathScore = Math.max(
            0,
            1000 - pathDifference * 15
        );

        const deadEndTarget =
            Math.max(2, Math.floor(size * (0.35 + level * 0.015)));

        const deadEndDifference =
            Math.abs(deadEnds - deadEndTarget);

        const deadEndScore =
            Math.max(0, 500 - deadEndDifference * 25);

        return pathScore + deadEndScore + pathLength * 3;
    }


    function generateMaze(size, level, seed) {
        const difficulty = getDifficulty(level);

        let bestMaze = null;
        let bestScore = -Infinity;

        /*
         * Створюємо декілька кандидатів.
         * Потім беремо той, який найбільше відповідає
         * складності поточного рівня.
         */
        for (let attempt = 0; attempt < difficulty.attempts; attempt++) {
            const candidateSeed =
                seed + attempt * 7919 + level * 104729;

            const random = createSeedRandom(candidateSeed);

            const grid = generateBaseMaze(size, candidateSeed);

            addDifficultyFeatures(
                grid,
                size,
                level,
                random
            );

            const score = scoreMaze(
                grid,
                size,
                level
            );

            if (score > bestScore) {
                bestScore = score;
                bestMaze = grid;
            }
        }

        return bestMaze;
    }


    function startGame(level, mode) {
        currentLevel = level;
        currentMode = mode;

        moves = 0;
        seconds = 0;
        gamePaused = false;
        gameActive = true;

        clearInterval(timer);

        /*
         * CAMPAIGN:
         * кожен рівень має стабільний seed.
         * Тобто при повторному проходженні
         * рівень залишається тим самим.
         *
         * RANDOM:
         * кожен запуск отримує новий seed.
         */
        if (mode === "campaign") {
            currentSeed = 1000 + level * 99991;
        } else {
            currentSeed =
                Date.now() +
                Math.floor(Math.random() * 1000000);
        }

        const size = getMazeSize(level);

        maze = generateMaze(
            size,
            level,
            currentSeed
        );

        player = {
            x: 0,
            y: 0
        };

        exit = {
            x: size - 1,
            y: size - 1
        };

        menuScreen.classList.add("hidden");
        winScreen.classList.add("hidden");
        gameScreen.classList.remove("hidden");

        levelText.textContent =
            `LEVEL ${currentLevel}`;

        modeText.textContent =
            currentMode === "campaign"
                ? "CAMPAIGN"
                : "RANDOM";

        movesText.textContent = "MOVES: 0";
        timerText.textContent = "TIME: 0";

        resizeCanvas();
        drawMaze();

        timer = setInterval(() => {
            if (!gamePaused && gameActive) {
                seconds++;

                timerText.textContent =
                    `TIME: ${seconds}`;
            }
        }, 1000);
    }


    function resizeCanvas() {
        const size = maze.length;

        const maxWidth =
            Math.min(
                window.innerWidth - 30,
                720
            );

        const maxHeight =
            Math.min(
                window.innerHeight - 210,
                720
            );

        const canvasSize =
            Math.max(
                260,
                Math.min(
                    maxWidth,
                    maxHeight
                )
            );

        canvas.width = canvasSize;
        canvas.height = canvasSize;
    }


    function drawMaze() {
        if (!maze || !maze.length) return;

        const size = maze.length;
        const cellSize = canvas.width / size;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        /*
         * Фон
         */
        ctx.fillStyle = "#000";
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        /*
         * Стіни
         */
        ctx.strokeStyle = "#00ff41";
        ctx.lineWidth =
            Math.max(1, cellSize * 0.08);

        ctx.shadowBlur = 4;
        ctx.shadowColor = "#00ff41";

        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                if (maze[y][x] === 1) {
                    ctx.strokeRect(
                        x * cellSize,
                        y * cellSize,
                        cellSize,
                        cellSize
                    );
                }
            }
        }

        ctx.shadowBlur = 0;

        /*
         * Вихід
         */
        const exitPadding =
            cellSize * 0.22;

        ctx.fillStyle = "#ff1744";
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#ff1744";

        ctx.fillRect(
            exit.x * cellSize + exitPadding,
            exit.y * cellSize + exitPadding,
            cellSize - exitPadding * 2,
            cellSize - exitPadding * 2
        );

        ctx.shadowBlur = 0;

        /*
         * Гравець
         */
        const playerPadding =
            cellSize * 0.24;

        ctx.fillStyle = "#00ff41";
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#00ff41";

        ctx.fillRect(
            player.x * cellSize + playerPadding,
            player.y * cellSize + playerPadding,
            cellSize - playerPadding * 2,
            cellSize - playerPadding * 2
        );

        ctx.shadowBlur = 0;
    }


    function movePlayer(dx, dy) {
        if (!gameActive || gamePaused) return;

        const newX = player.x + dx;
        const newY = player.y + dy;

        if (
            newX < 0 ||
            newX >= maze.length ||
            newY < 0 ||
            newY >= maze.length
        ) {
            return;
        }

        /*
         * 1 = стіна
         * 0 = прохід
         */
        if (maze[newY][newX] === 1) {
            return;
        }

        player.x = newX;
        player.y = newY;

        moves++;

        movesText.textContent =
            `MOVES: ${moves}`;

        drawMaze();

        if (
            player.x === exit.x &&
            player.y === exit.y
        ) {
            levelCompleted();
        }
    }


    function levelCompleted() {
        gameActive = false;

        clearInterval(timer);

        finalLevelText.textContent =
            `LEVEL ${currentLevel} COMPLETE`;

        finalStatsText.textContent =
            `TIME: ${seconds}  |  MOVES: ${moves}`;

        saveRecord();

        /*
         * У CAMPAIGN переходимо до наступного рівня.
         * У RANDOM після перемоги можна створити
         * абсолютно новий випадковий лабіринт.
         */
        if (
            currentMode === "campaign" &&
            currentLevel >= 50
        ) {
            finalMessageText.textContent =
                "CAMPAIGN COMPLETE!";
            nextButton.textContent =
                "BACK TO MENU";
        } else {
            finalMessageText.textContent =
                currentMode === "campaign"
                    ? "LEVEL CLEARED"
                    : "NEW MAZE READY";

            nextButton.textContent =
                currentMode === "campaign"
                    ? "NEXT LEVEL"
                    : "NEXT RANDOM";
        }

        gameScreen.classList.add("hidden");
        winScreen.classList.remove("hidden");
    }


    function nextLevel() {
        if (
            currentMode === "campaign" &&
            currentLevel >= 50
        ) {
            backToMenu();
            return;
        }

        if (currentMode === "campaign") {
            startGame(
                currentLevel + 1,
                "campaign"
            );
        } else {
            startGame(
                currentLevel,
                "random"
            );
        }
    }


    function restartLevel() {
        startGame(
            currentLevel,
            currentMode
        );
    }


    function togglePause() {
        if (!gameActive) return;

        gamePaused = !gamePaused;

        pauseButton.textContent =
            gamePaused
                ? "▶ RESUME"
                : "Ⅱ PAUSE";

        if (gamePaused) {
            pauseOverlay.classList.remove("hidden");
        } else {
            pauseOverlay.classList.add("hidden");
        }
    }


    function backToMenu() {
        clearInterval(timer);

        gameActive = false;
        gamePaused = false;

        gameScreen.classList.add("hidden");
        winScreen.classList.add("hidden");
        menuScreen.classList.remove("hidden");

        pauseOverlay.classList.add("hidden");

        pauseButton.textContent =
            "Ⅱ PAUSE";
    }


    function saveRecord() {
        const key =
            `maze_record_${currentMode}_${currentLevel}`;

        const oldRecord =
            localStorage.getItem(key);

        const newRecord = {
            time: seconds,
            moves: moves
        };

        if (!oldRecord) {
            localStorage.setItem(
                key,
                JSON.stringify(newRecord)
            );
            return;
        }

        try {
            const parsed =
                JSON.parse(oldRecord);

            /*
             * Спочатку важливіший час.
             * Якщо час однаковий — менше ходів.
             */
            if (
                seconds < parsed.time ||
                (
                    seconds === parsed.time &&
                    moves < parsed.moves
                )
            ) {
                localStorage.setItem(
                    key,
                    JSON.stringify(newRecord)
                );
            }
        } catch {
            localStorage.setItem(
                key,
                JSON.stringify(newRecord)
            );
        }
    }


    /*
     * Клавіатура
     */
    document.addEventListener(
        "keydown",
        event => {
            if (!gameActive) return;

            switch (event.key) {
                case "ArrowUp":
                case "w":
                case "W":
                    event.preventDefault();
                    movePlayer(0, -1);
                    break;

                case "ArrowDown":
                case "s":
                case "S":
                    event.preventDefault();
                    movePlayer(0, 1);
                    break;

                case "ArrowLeft":
                case "a":
                case "A":
                    event.preventDefault();
                    movePlayer(-1, 0);
                    break;

                case "ArrowRight":
                case "d":
                case "D":
                    event.preventDefault();
                    movePlayer(1, 0);
                    break;

                case "Escape":
                    togglePause();
                    break;
            }
        }
    );


    /*
     * Кнопки меню
     */
    campaignButton.addEventListener(
        "click",
        () => {
            startGame(1, "campaign");
        }
    );


    randomButton.addEventListener(
        "click",
        () => {
            startGame(1, "random");
        }
    );


    restartButton.addEventListener(
        "click",
        () => {
            restartLevel();
        }
    );


    pauseButton.addEventListener(
        "click",
        () => {
            togglePause();
        }
    );


    nextButton.addEventListener(
        "click",
        () => {
            nextLevel();
        }
    );


    menuButton.addEventListener(
        "click",
        () => {
            backToMenu();
        }
    );


    /*
     * Мобільні кнопки
     */
    upButton.addEventListener(
        "click",
        () => movePlayer(0, -1)
    );

    downButton.addEventListener(
        "click",
        () => movePlayer(0, 1)
    );

    leftButton.addEventListener(
        "click",
        () => movePlayer(-1, 0)
    );

    rightButton.addEventListener(
        "click",
        () => movePlayer(1, 0)
    );


    /*
     * Не даємо мобільному браузеру
     * випадково прокручувати сторінку
     * під час натискання кнопок.
     */
    [
        upButton,
        downButton,
        leftButton,
        rightButton
    ].forEach(button => {
        button.addEventListener(
            "touchstart",
            event => {
                event.preventDefault();
            },
            { passive: false }
        );
    });


    window.addEventListener(
        "resize",
        () => {
            if (gameActive) {
                resizeCanvas();
                drawMaze();
            }
        }
    );
</script>

</body>
</html>
