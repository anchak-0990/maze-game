<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAZE — Anchak Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #00ff41;
            font-family: "Courier New", monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        #game {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            text-shadow: 0 0 10px #00ff41;
        }

        .subtitle {
            margin: 5px 0 25px;
            color: #00aa2a;
        }

        button {
            font-family: "Courier New", monospace;
            cursor: pointer;
            color: #00ff41;
            background: #000;
            border: 1px solid #00ff41;
            padding: 12px 22px;
            font-size: 16px;
            margin: 6px;
            transition: 0.2s;
            touch-action: manipulation;
        }

        button:hover {
            background: #003311;
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.5);
        }

        button:active {
            background: #00551c;
        }

        .menu-button {
            display: block;
            width: 280px;
            max-width: 100%;
            margin: 15px auto;
            font-size: 18px;
        }

        #menu p {
            color: #008f24;
        }

        #gameScreen {
            display: none;
        }

        #hud {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }

        .hud-item {
            border: 1px solid #00ff41;
            padding: 7px 12px;
            min-width: 105px;
            font-size: 14px;
        }

        #mazeWrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }

        #maze {
            display: grid;
            gap: 1px;
            background: #00ff41;
            border: 3px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.25);
            width: min(80vw, 650px);
            height: min(80vw, 650px);
            max-width: 80vh;
            max-height: 80vh;
            user-select: none;
        }

        .cell {
            background: #050505;
            min-width: 0;
            min-height: 0;
        }

        .wall {
            background: #222;
            box-shadow: inset 0 0 4px #000;
        }

        .player {
            background: #00ff41;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff41;
            margin: 15%;
        }

        .exit {
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff0000;
            margin: 15%;
        }

        #message {
            min-height: 24px;
            margin: 15px 0 5px;
        }

        #controls {
            margin-top: 10px;
        }

        .control-row {
            display: flex;
            justify-content: center;
        }

        .control-button {
            width: 58px;
            height: 48px;
            padding: 0;
            margin: 3px;
            font-size: 22px;
        }

        #winScreen {
            display: none;
        }

        #winScreen h2 {
            font-size: 30px;
            text-shadow: 0 0 10px #00ff41;
        }

        .win-stats {
            border: 1px solid #00ff41;
            padding: 15px;
            margin: 20px auto;
            max-width: 350px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            #game {
                padding: 12px;
            }

            #maze {
                width: 88vw;
                height: 88vw;
            }

            .hud-item {
                min-width: 90px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <!-- =========================
         ГОЛОВНЕ МЕНЮ
    ========================== -->

    <div id="menu">

        <h1>🧩 MAZE test 123</h1>

        <div class="subtitle">
            [ MAZE DECODER SYSTEM ]
        </div>

        <p>Обери режим:</p>

        <button class="menu-button" id="campaignButton">
            ▶️ CAMPAIGN
        </button>

        <button class="menu-button" id="randomButton">
            🎲 RANDOM
        </button>

        <p>
            Стрілочки / WASD<br>
            або сенсорні кнопки
        </p>

    </div>


    <!-- =========================
         ЕКРАН ГРИ
    ========================== -->

    <div id="gameScreen">

        <h1>🧩 MAZE</h1>

        <div id="hud">

            <div class="hud-item">
                MODE:
                <span id="modeText">---</span>
            </div>

            <div class="hud-item">
                LEVEL:
                <span id="levelText">1</span>
            </div>

            <div class="hud-item">
                SIZE:
                <span id="sizeText">9x9</span>
            </div>

            <div class="hud-item">
                MOVES:
                <span id="movesText">0</span>
            </div>

            <div class="hud-item">
                TIME:
                <span id="timeText">0</span>s
            </div>

        </div>


        <div id="mazeWrapper">
            <div id="maze"></div>
        </div>


        <div id="message">
            Дійди до червоної точки!
        </div>


        <div>
            <button id="restartButton">
                🔄 RESTART
            </button>

            <button id="pauseButton">
                ⏸️ PAUSE
            </button>

            <button id="menuButton">
                🏠 MENU
            </button>
        </div>


        <!-- СЕНСОРНЕ КЕРУВАННЯ -->

        <div id="controls">

            <div class="control-row">
                <button class="control-button" id="upButton">
                    ⬆️
                </button>
            </div>

            <div class="control-row">

                <button class="control-button" id="leftButton">
                    ⬅️
                </button>

                <button class="control-button" id="downButton">
                    ⬇️
                </button>

                <button class="control-button" id="rightButton">
                    ➡️
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         ЕКРАН ПЕРЕМОГИ
    ========================== -->

    <div id="winScreen">

        <h1>🧩 MAZE</h1>

        <h2>ACCESS GRANTED</h2>

        <div class="win-stats">

            LEVEL:
            <span id="winLevel">1</span>

            <br>

            MOVES:
            <span id="winMoves">0</span>

            <br>

            TIME:
            <span id="winTime">0</span>s

            <br>

            BEST MOVES:
            <span id="bestMoves">---</span>

            <br>

            BEST TIME:
            <span id="bestTime">---</span>s

        </div>


        <button id="nextLevelButton">
            ▶️ NEXT LEVEL
        </button>

        <button id="winMenuButton">
            🏠 MENU
        </button>

    </div>

</div>


<script>

    /* =========================
       НАЛАШТУВАННЯ
    ========================== */

    const MIN_SIZE = 9;
    const MAX_SIZE = 25;

    let currentLevel = 1;
    let currentMode = "campaign";

    let maze = [];
    let mazeSize = MIN_SIZE;

    let player = {
        x: 0,
        y: 0
    };

    let exit = {
        x: 0,
        y: 0
    };

    let moves = 0;
    let seconds = 0;

    let timer = null;
    let gamePaused = false;
    let gameActive = false;

    /*
        У Campaign зберігаємо seed
        кожного рівня.

        Тому Level 1 завжди однаковий,
        Level 2 завжди однаковий і т.д.
    */

    let currentSeed = 0;


    /* =========================
       HTML ЕЛЕМЕНТИ
    ========================== */

    const menu =
        document.getElementById("menu");

    const gameScreen =
        document.getElementById("gameScreen");

    const winScreen =
        document.getElementById("winScreen");

    const mazeContainer =
        document.getElementById("maze");

    const modeText =
        document.getElementById("modeText");

    const levelText =
        document.getElementById("levelText");

    const sizeText =
        document.getElementById("sizeText");

    const movesText =
        document.getElementById("movesText");

    const timeText =
        document.getElementById("timeText");

    const message =
        document.getElementById("message");

    const pauseButton =
        document.getElementById("pauseButton");


    /* =========================
       КНОПКИ
    ========================== */

    document
        .getElementById("campaignButton")
        .addEventListener(
            "click",
            startCampaign
        );

    document
        .getElementById("randomButton")
        .addEventListener(
            "click",
            startRandom
        );

    document
        .getElementById("restartButton")
        .addEventListener(
            "click",
            restartLevel
        );

    pauseButton.addEventListener(
        "click",
        pauseGame
    );

    document
        .getElementById("menuButton")
        .addEventListener(
            "click",
            backToMenu
        );

    document
        .getElementById("nextLevelButton")
        .addEventListener(
            "click",
            nextLevel
        );

    document
        .getElementById("winMenuButton")
        .addEventListener(
            "click",
            backToMenu
        );


    /* =========================
       СЕНСОРНІ КНОПКИ
    ========================== */

    document
        .getElementById("upButton")
        .addEventListener(
            "click",
            function () {
                movePlayer(0, -1);
            }
        );

    document
        .getElementById("downButton")
        .addEventListener(
            "click",
            function () {
                movePlayer(0, 1);
            }
        );

    document
        .getElementById("leftButton")
        .addEventListener(
            "click",
            function () {
                movePlayer(-1, 0);
            }
        );

    document
        .getElementById("rightButton")
        .addEventListener(
            "click",
            function () {
                movePlayer(1, 0);
            }
        );


    /* =========================
       РОЗМІР ЛАБІРИНТУ
    ========================== */

    function getMazeSize(level) {

        if (level <= 3) {
            return 9;
        }

        if (level <= 6) {
            return 11;
        }

        if (level <= 10) {
            return 13;
        }

        if (level <= 15) {
            return 15;
        }

        if (level <= 20) {
            return 17;
        }

        if (level <= 25) {
            return 19;
        }

        if (level <= 30) {
            return 21;
        }

        if (level <= 35) {
            return 23;
        }

        return MAX_SIZE;
    }


    /* =========================
       SEED RANDOM
    ========================== */

    function createSeedRandom(seed) {

        let value = seed >>> 0;

        return function () {

            value += 0x6D2B79F5;

            let t = value;

            t =
                Math.imul(
                    t ^ (t >>> 15),
                    t | 1
                );

            t ^=
                t +
                Math.imul(
                    t ^ (t >>> 7),
                    t | 61
                );

            return (
                (t ^ (t >>> 14)) >>> 0
            ) / 4294967296;
        };
    }


    /* =========================
       SHUFFLE
    ========================== */

    function shuffleDirections(
        directions,
        random
    ) {

        for (
            let i = directions.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    random() * (i + 1)
                );

            const temp =
                directions[i];

            directions[i] =
                directions[j];

            directions[j] =
                temp;
        }

        return directions;
    }


    /* =========================
       ГЕНЕРАЦІЯ ЛАБІРИНТУ
    ========================== */

    function generateMaze(
        size,
        seed
    ) {

        const grid = [];

        for (
            let y = 0;
            y < size;
            y++
        ) {

            grid[y] = [];

            for (
                let x = 0;
                x < size;
                x++
            ) {

                grid[y][x] = 1;
            }
        }


        const random =
            createSeedRandom(seed);


        const stack = [];

        grid[0][0] = 0;

        stack.push({
            x: 0,
            y: 0
        });


        while (stack.length > 0) {

            const current =
                stack[stack.length - 1];


            let directions = [
                {
                    dx: 2,
                    dy: 0
                },
                {
                    dx: -2,
                    dy: 0
                },
                {
                    dx: 0,
                    dy: 2
                },
                {
                    dx: 0,
                    dy: -2
                }
            ];


            directions =
                shuffleDirections(
                    directions,
                    random
                );


            let moved = false;


            for (
                let i = 0;
                i < directions.length;
                i++
            ) {

                const direction =
                    directions[i];


                const nx =
                    current.x +
                    direction.dx;

                const ny =
                    current.y +
                    direction.dy;


                if (nx < 0) {
                    continue;
                }

                if (nx >= size) {
                    continue;
                }

                if (ny < 0) {
                    continue;
                }

                if (ny >= size) {
                    continue;
                }

                if (grid[ny][nx] !== 1) {
                    continue;
                }


                const middleX =
                    current.x +
                    direction.dx / 2;

                const middleY =
                    current.y +
                    direction.dy / 2;


                grid[middleY][middleX] =
                    0;

                grid[ny][nx] =
                    0;


                stack.push({
                    x: nx,
                    y: ny
                });


                moved = true;

                break;
            }


            if (!moved) {
                stack.pop();
            }
        }


        /*
            Робимо нижній правий кут
            гарантовано доступним.
        */

        const exitX =
            size - 1;

        const exitY =
            size - 1;


        grid[exitY][exitX] =
            0;


        grid[exitY][exitX - 1] =
            0;


        grid[exitY - 1][exitX] =
            0;


        return grid;
    }


    /* =========================
       SEED ДЛЯ CAMPAIGN
    ========================== */

    function getCampaignSeed(level) {

        /*
            Число залежить тільки від номера
            рівня.

            Отже один рівень завжди
            отримує той самий лабіринт.
        */

        return (
            918273 +
            level * 7919
        );
    }


    /* =========================
       SEED ДЛЯ RANDOM
    ========================== */

    function getRandomSeed() {

        return Math.floor(
            Math.random() * 2147483647
        );
    }


    /* =========================
       CAMPAIGN
    ========================== */

    function startCampaign() {

        currentMode =
            "campaign";

        currentLevel =
            1;

        startLevel();
    }


    /* =========================
       RANDOM
    ========================== */

    function startRandom() {

        currentMode =
            "random";

        currentLevel =
            1;

        startLevel();
    }


    /* =========================
       ЗАПУСК РІВНЯ
    ========================== */

    function startLevel() {

        clearInterval(timer);


        gamePaused =
            false;

        gameActive =
            true;


        moves =
            0;

        seconds =
            0;


        mazeSize =
            getMazeSize(
                currentLevel
            );


        if (
            currentMode === "campaign"
        ) {

            currentSeed =
                getCampaignSeed(
                    currentLevel
                );

        } else {

            currentSeed =
                getRandomSeed();
        }


        maze =
            generateMaze(
                mazeSize,
                currentSeed
            );


        player = {
            x: 0,
            y: 0
        };


        exit = {
            x: mazeSize - 1,
            y: mazeSize - 1
        };


        if (
            currentMode === "campaign"
        ) {

            modeText.innerText =
                "CAMPAIGN";

        } else {

            modeText.innerText =
                "RANDOM";
        }


        levelText.innerText =
            currentLevel;


        sizeText.innerText =
            mazeSize +
            "x" +
            mazeSize;


        movesText.innerText =
            moves;


        timeText.innerText =
            seconds;


        message.innerText =
            "Дійди до червоної точки!";


        pauseButton.innerText =
            "⏸️ PAUSE";


        menu.style.display =
            "none";

        winScreen.style.display =
            "none";

        gameScreen.style.display =
            "block";


        drawMaze();


        timer =
            setInterval(
                function () {

                    if (!gameActive) {
                        return;
                    }

                    if (gamePaused) {
                        return;
                    }

                    seconds++;

                    timeText.innerText =
                        seconds;

                },
                1000
            );
    }


    /* =========================
       МАЛЮВАННЯ
    ========================== */

    function drawMaze() {

        mazeContainer.innerHTML =
            "";


        mazeContainer.style.gridTemplateColumns =
            "repeat(" +
            mazeSize +
            ", 1fr)";


        mazeContainer.style.gridTemplateRows =
            "repeat(" +
            mazeSize +
            ", 1fr)";


        for (
            let y = 0;
            y < mazeSize;
            y++
        ) {

            for (
                let x = 0;
                x < mazeSize;
                x++
            ) {

                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className =
                    "cell";


                if (
                    maze[y][x] === 1
                ) {

                    cell.classList.add(
